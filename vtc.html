<!DOCTYPE html>
<html lang="th">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>แจ้งอุปกรณ์ VTC เสีย</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #1976d2;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #1976d2;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>🖥️ แจ้งอุปกรณ์ VTC เสีย</h1>

    <form id="vtcForm">

      <label>👤 ชื่อผู้แจ้ง</label>

      <input
        type="text"
        id="reporter"
        placeholder="กรอกชื่อผู้แจ้ง"
        required
      >

      <label>🖥️ อุปกรณ์</label>

      <select id="equipment" required>
  <option value="">เลือกอุปกรณ์</option>
  <option value="กล้อง">กล้อง</option>
  <option value="ไมค์">ไมค์</option>
  <option value="จอภาพ">จอภาพ</option>
  <option value="รีโมต">รีโมต</option>
  <option value="คอมพิวเตอร์">คอมพิวเตอร์</option>
</select>

      <label>🏢 อาคาร</label>
      <label>รายละเอียด</label>
<textarea id="detail" rows="4" placeholder="พิมพ์รายละเอียดอาการเสีย"></textarea>

      <input
        type="text"
        id="building"
        placeholder="กรอกอาคาร"
        required
      >

      <button
        type="submit"
        id="submitBtn"
      >
        แจ้งอุปกรณ์เสีย
      </button>

    </form>

    <div
      id="message"
      class="message"
    ></div>

  </div>


  <script>

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbzng6R4jUPXctKgFKu9xkVgQIDNW8ZBhJiHg1ozGYg31aiT_nIYkDAMqyhUt25N_R8U-g/exec";


    document
      .getElementById("vtcForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const reporter =
          document.getElementById("reporter").value.trim();

        const equipment =
          document.getElementById("equipment").value.trim();

        const building =
          document.getElementById("building").value.trim();


        if (!reporter || !equipment || !building) {

          alert("กรุณากรอกข้อมูลให้ครบ");

          return;

        }


        const submitBtn =
          document.getElementById("submitBtn");

        const message =
          document.getElementById("message");


        submitBtn.disabled = true;

        submitBtn.textContent = "กำลังบันทึก...";


        try {

          const data =
            new URLSearchParams();

          data.append(
            "action",
            "save_vtc"
          );

          data.append(
            "reporter",
            reporter
          );

          data.append(
            "equipment",
            equipment
          );

          data.append(
            "building",
            building
          );
          data.append(
  "detail",
  document.getElementById("detail").value
);


await fetch(
  GAS_URL,
  {
    method: "POST",
    body: data,
    mode: "no-cors"
  }
);


          await fetch(
            GAS_URL,
            {
              method: "POST",
              body: data,
              mode: "no-cors"
            }
          );


          message.textContent =
            "✅ บันทึกแจ้งอุปกรณ์ VTC เรียบร้อยแล้ว";

          message.style.color = "green";


          document
            .getElementById("vtcForm")
            .reset();


        } catch (error) {

          console.error(error);

          message.textContent =
            "❌ เกิดข้อผิดพลาดในการบันทึก";

          message.style.color = "red";

        }


        submitBtn.disabled = false;

        submitBtn.textContent =
          "แจ้งอุปกรณ์เสีย";

      });

  </script>

</body>
</html>
