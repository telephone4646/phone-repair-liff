<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>แจ้งซ่อมโทรศัพท์ บน.46</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: #1976d2;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .line-status {
      text-align: center;
      margin-bottom: 15px;
      color: #198754;
      font-size: 14px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #1976d2;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    .success {
      text-align: center;
      padding: 30px 10px;
    }

    .success h2 {
      color: #198754;
    }

    .ticket {
      font-size: 24px;
      font-weight: bold;
      color: #1976d2;
      margin: 20px 0;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card" id="formCard">

    <h1>📱 แจ้งซ่อมโทรศัพท์</h1>

    <div class="subtitle">
      ระบบแจ้งซ่อมโทรศัพท์ บน.46
    </div>

    <div id="lineStatus" class="line-status">
      กำลังเชื่อมต่อ LINE...
    </div>

    <form id="repairForm">

      <label>เบอร์โทรศัพท์</label>
      <input
        type="text"
        id="phone_number"
        placeholder="กรอกเบอร์โทรศัพท์"
        required
      >

      <label>ชื่อผู้แจ้ง</label>
      <input
        type="text"
        id="reporter"
        placeholder="กรอกชื่อผู้แจ้ง"
        required
      >

      <label>แผนก</label>
      <input
        type="text"
        id="department"
        placeholder="กรอกแผนก"
      >

      <label>สถานที่</label>
      <input
        type="text"
        id="location"
        placeholder="กรอกสถานที่"
      >

      <label>ปัญหา</label>
      <select id="problem" required>
        <option value="">-- เลือกปัญหา --</option>
        <option value="โทรศัพท์ไม่มีสัญญาณ">โทรศัพท์ไม่มีสัญญาณ</option>
        <option value="โทรออกไม่ได้">โทรออกไม่ได้</option>
        <option value="รับสายไม่ได้">รับสายไม่ได้</option>
        <option value="เสียงไม่ชัด">เสียงไม่ชัด</option>
        <option value="โทรศัพท์เสีย">โทรศัพท์เสีย</option>
        <option value="อื่น ๆ">อื่น ๆ</option>
      </select>

      <label>รายละเอียดเพิ่มเติม</label>
      <textarea
        id="detail"
        placeholder="อธิบายอาการหรือรายละเอียดเพิ่มเติม"
      ></textarea>

      <button type="submit" id="submitBtn">
        📤 ส่งแจ้งซ่อม
      </button>

    </form>

  </div>


  <div class="card hidden" id="successCard">

    <div class="success">

      <h2>✅ แจ้งซ่อมสำเร็จ</h2>

      <p>ระบบได้รับแจ้งซ่อมของคุณแล้ว</p>

      <div class="ticket" id="ticketNumber"></div>

      <p>กรุณาเก็บหมายเลข Ticket ไว้สำหรับติดตามงาน</p>

    </div>

  </div>

</div>


<script>

  const LIFF_ID = "2011466060-6CTtEiz2";

  const GAS_URL =
    "https://script.google.com/macros/s/AKfycbzng6R4jUPXctKgFKu9xkVgQIDNW8ZBhJiHg1ozGYg31aiT_nIYkDAMqyhUt25N_R8U-g/exec";


  let lineUserId = "";


  async function initLiff() {

    try {

      await liff.init({
        liffId: LIFF_ID
      });


      if (!liff.isLoggedIn()) {

        liff.login();

        return;

      }


      const profile = await liff.getProfile();

      lineUserId = profile.userId;


      document.getElementById("lineStatus").textContent =
        "✓ เชื่อมต่อ LINE แล้ว";


      console.log("LINE USER ID:", lineUserId);


    } catch (error) {

      console.error("LIFF ERROR:", error);

      document.getElementById("lineStatus").textContent =
        "ไม่สามารถเชื่อมต่อ LINE ได้";

    }

  }


  document
    .getElementById("repairForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();


      if (!lineUserId) {

        alert("ยังไม่สามารถเชื่อมต่อ LINE ได้ กรุณาปิดแล้วเปิดระบบใหม่อีกครั้ง");

        return;

      }


      const submitBtn =
        document.getElementById("submitBtn");


      submitBtn.disabled = true;

      submitBtn.textContent = "กำลังส่งข้อมูล...";


      const data = new URLSearchParams();


      data.append(
        "phone_number",
        document.getElementById("phone_number").value
      );

      data.append(
        "reporter",
        document.getElementById("reporter").value
      );

      data.append(
        "department",
        document.getElementById("department").value
      );

      data.append(
        "location",
        document.getElementById("location").value
      );

      data.append(
        "problem",
        document.getElementById("problem").value
      );

      data.append(
        "detail",
        document.getElementById("detail").value
      );

      data.append(
        "line_user_id",
        lineUserId
      );


      try {

        await fetch(GAS_URL, {

          method: "POST",

          body: data,

          mode: "no-cors"

        });


        document.getElementById("formCard")
          .classList.add("hidden");

        document.getElementById("successCard")
          .classList.remove("hidden");


        document.getElementById("ticketNumber").textContent =
          "กำลังบันทึกข้อมูล...";


      } catch (error) {

        console.error(error);

        alert("เกิดข้อผิดพลาดในการส่งข้อมูล");

        submitBtn.disabled = false;

        submitBtn.textContent = "📤 ส่งแจ้งซ่อม";

      }

    });


  window.addEventListener("load", initLiff);

</script>

</body>
</html>
